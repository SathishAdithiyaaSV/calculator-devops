services:
  calculator-api:
    image: ${DOCKERHUB_USERNAME:-local}/calculator-api:${IMAGE_TAG:-latest}
    build:
      context: .
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    restart: unless-stopped
    networks:
      - calculator-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      calculator-api:
        condition: service_healthy
    ports:
      - "${API_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - calculator-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  calculator-network:
    name: calculator-network
